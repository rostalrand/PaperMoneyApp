name: "🐛 Bug Report"
description: File an issue about a bug or unexpected behavior in PaperMoneyApp.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill out the details below.
  - type: input
    id: environment
    attributes:
      label: iOS Version & Device
      description: e.g. iOS 17.5 on iPhone 15 Pro, or browser if using simulator.html.
      placeholder: iOS 17.5 (iPhone 15 Pro)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: 1. Go to '...'\n2. Click on '...'\n3. Scroll down to '...'\n4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
