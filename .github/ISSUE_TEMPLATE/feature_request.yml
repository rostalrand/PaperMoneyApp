name: "💡 Feature Request"
description: Propose a new feature or enhancement for PaperMoneyApp.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea to make paper trading even better? Share it here!
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: What would you like to see added or improved?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Solved / User Benefit
      description: Is your feature request related to a problem or educational need?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features considered.
