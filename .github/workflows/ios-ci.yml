name: iOS CI & Build Simulator App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Package Simulator App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode & Environment Info
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" || true

      - name: Build Native iOS Simulator App Bundle
        run: |
          xcodebuild build \
            -project PaperMoneyApp.xcodeproj \
            -scheme PaperMoneyApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath derived_data \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Compress Simulator App for Cloud Streaming
        run: |
          cd derived_data/Build/Products/Debug-iphonesimulator
          zip -r PaperMoneyApp-Simulator.app.zip PaperMoneyApp.app

      - name: Upload Simulator App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaperMoneyApp-Simulator-Build
          path: derived_data/Build/Products/Debug-iphonesimulator/PaperMoneyApp-Simulator.app.zip
          retention-days: 14

      - name: Execute XCTest Suite
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Discovered active iOS Simulator UUID: $SIM_ID"
          if [ -n "$SIM_ID" ]; then
            xcodebuild test \
              -project PaperMoneyApp.xcodeproj \
              -scheme PaperMoneyApp \
              -destination "id=$SIM_ID" \
              -configuration Debug \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "No iPhone simulator found, running on generic destination..."
            xcodebuild test \
              -project PaperMoneyApp.xcodeproj \
              -scheme PaperMoneyApp \
              -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
              -configuration Debug \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi
