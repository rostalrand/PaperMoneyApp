name: iOS CI & Build Simulator App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Package Simulator App & IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Discover iOS Simulator Destination
        id: sim_dest
        run: |
          xcodebuild -version
          echo "Listing destinations for PaperMoneyApp:"
          xcodebuild -project PaperMoneyApp.xcodeproj -scheme PaperMoneyApp -showdestinations || true
          
          # Extract first valid iOS Simulator destination ID
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Selected Simulator ID: $SIM_ID"
          if [ -n "$SIM_ID" ]; then
            echo "dest=id=$SIM_ID" >> $GITHUB_OUTPUT
          else
            echo "dest=platform=iOS Simulator,name=iPhone 16" >> $GITHUB_OUTPUT
          fi

      - name: Build Native iOS Simulator App Bundle
        run: |
          echo "Building using destination: ${{ steps.sim_dest.outputs.dest }}"
          set -o pipefail
          xcodebuild build \
            -project PaperMoneyApp.xcodeproj \
            -scheme PaperMoneyApp \
            -destination "${{ steps.sim_dest.outputs.dest }}" \
            -configuration Debug \
            -derivedDataPath derived_data \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || (
              echo "=== Emitting GitHub Annotations for Failure ==="
              grep -E "(error:|fatal error:)" build.log | head -n 15 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            )

      - name: Compress Simulator App for Cloud Streaming
        run: |
          cd derived_data/Build/Products/Debug-iphonesimulator
          zip -r PaperMoneyApp-Simulator.app.zip PaperMoneyApp.app

      - name: Upload Simulator App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaperMoneyApp-Simulator-Build
          path: derived_data/Build/Products/Debug-iphonesimulator/PaperMoneyApp-Simulator.app.zip
          retention-days: 14

      - name: Build Native iOS Device App & Package IPA
        run: |
          echo "Building unsigned IPA for physical device / distribution..."
          xcodebuild build \
            -project PaperMoneyApp.xcodeproj \
            -scheme PaperMoneyApp \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath derived_data_device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          mkdir -p Payload
          cp -r derived_data_device/Build/Products/Release-iphoneos/PaperMoneyApp.app Payload/
          zip -r PaperMoneyApp.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaperMoneyApp-Device-IPA
          path: PaperMoneyApp.ipa
          retention-days: 14

      - name: Publish to GitHub Releases (Main Branch Only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PaperMoneyApp v1.0.0 (Release & Simulator Builds)"
          body: |
            ### PaperMoneyApp v1.0.0
            
            - **`PaperMoneyApp.ipa`**: Native iOS package for physical iPhone / iPad installation via AltStore, Sideloadly, or Apple Configurator.
            - **`PaperMoneyApp-Simulator.app.zip`**: iOS Simulator build for Appetize.io cloud streaming or macOS Xcode Simulator.
          files: |
            PaperMoneyApp.ipa
            derived_data/Build/Products/Debug-iphonesimulator/PaperMoneyApp-Simulator.app.zip

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-Build-Log
          path: build.log

      - name: Execute XCTest Suite
        continue-on-error: true
        run: |
          xcodebuild test \
            -project PaperMoneyApp.xcodeproj \
            -scheme PaperMoneyApp \
            -destination "${{ steps.sim_dest.outputs.dest }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
